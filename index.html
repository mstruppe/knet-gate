<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knet.network</title>
<meta name="description" content="The gate to the projects under this roof. First: FRACTAL — an operating system for structured knowledge.">
<!-- THE GATE (Max's direction, 2026-08-18): knet.network is the umbrella's address — its
     content later built by KNet. For now a link tree: one card per project, FRACTAL first.
     Deliberately presented as an address, not a brand (OQ-34: the umbrella name is unresolved
     and KNET/K-NET are obstructed as marks — the wordmark decision waits for founding necessity). -->
<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #6e6e73;
    --faint: #a1a1a6;
    --hairline: rgba(10, 10, 10, 0.12);
    --hairline-soft: rgba(10, 10, 10, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #86868b;
      --faint: #58585c;
      --hairline: rgba(245, 245, 247, 0.16);
      --hairline-soft: rgba(245, 245, 247, 0.08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 34rem;
    width: 100%;
    margin: 0 auto;
    padding: 4rem 1.5rem;
  }
  .domain {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: var(--faint);
    margin: 0 0 2.6rem;
  }
  .card {
    display: block;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 1.6rem 1.8rem;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease;
  }
  .card:hover { border-color: var(--ink); }
  .card + .card { margin-top: 1.1rem; }
  .card-name {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.045em;
    margin: 0 0 0.5rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .card-name .go { font-size: 0.9rem; font-weight: 400; color: var(--faint); transition: color 0.2s ease; }
  .card:hover .go { color: var(--ink); }
  .card-info { margin: 0; font-size: 0.95rem; color: var(--muted); }
  footer {
    text-align: center;
    font-size: 0.78rem;
    color: var(--faint);
    padding: 2rem 1.5rem 2.5rem;
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  footer a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<main>
  <p class="domain">knet.network</p>

  <a class="card" href="https://mstruppe.github.io/fractal-mirror/">
    <p class="card-name">FRACTAL <span class="go">&rarr;</span></p>
    <p class="card-info">AI agents forget. Your project won&rsquo;t. An operating system for structured knowledge &mdash; project memory that survives every session, in plain text you own, with every release signed and externally timestamped.</p>
  </a>
</main>

<footer>
  <div><a href="mailto:fractal@knet.network">fractal@knet.network</a> &middot; <a href="https://mstruppe.github.io/fractal-mirror/legal.html">Legal notice &amp; privacy</a></div>
</footer>

</body>
</html>
